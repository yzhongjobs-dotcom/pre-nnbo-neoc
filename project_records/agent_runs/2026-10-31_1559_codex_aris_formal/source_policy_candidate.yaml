search_routes:
  driver: python -X utf8 -m arisctl --root RUN_ROOT；每步先status/allowed-actions；Controller记录每条查询。
  discovery_order:
  - SerpApi Google Scholar engine=google_scholar, SERPAPI_KEY
  - 仅SerpApi不可用时：真实浏览器/电脑交互、串行低频scholar.google.hk；无此能力即不可用，禁用HTTP抓取；遇验证码/429/403立即退出。
  - 仅上述两者均不可用时：arXiv与IEEE Xplore的去重并集；任何provider失败后下级返回或全不可用均按Controller进入HUMAN_SEARCH_REQUIRED并停止。
  low_recall_rule: 成功但少量、零结果或低相关不是provider故障；保持Scholar，通过定向细化、分页、年份/venue分层及前后向引文循环补齐。
  forbidden:
  - ordinary_web_search_as_discovery
  - site:scholar_web_search
  - ad_hoc_OpenAlex_or_S2_discovery
  - provider_suppression_after_one_failure
  - concurrent_Scholar_queries
  - CAPTCHA_or_rate_limit_bypass

authorship:
  role: main_research_agent
  executor: codex
  approval_status: CANDIDATE_REQUIRES_EXPLICIT_HUMAN_APPROVAL
field_scope:
  purpose: 补充本项目研究现状：领域进展、直接近邻和机制路线；不是选择仿真对照，不以能否复现或匹配传感器为纳入前提。
  project: E:\github_project\scan-impedance-update
  task: 位置接口协作臂恒力超声扫描：组织呼吸、推拉等运动与数十倍局部刚度变化并存。本文仅用力与编码器，在线辨识指定运动子空间下不变的刚度，以刚度将力换算为等效运动量测，IMM跟踪、时延预测前馈与刚度归一化导纳。这里是项目主张，未经本轮文献验证。
  publication_window:
    year_min: 2022
    year_max: 2026
    as_of: '2026-10-31'
    date_rule: 分别记录首次在线年与卷期年；2026年已正式在线、2027卷期者保留并标清；未正式录用的预印本单列，不冒称顶会顶刊。
  direct_topics:
  - 机器人超声在呼吸/患者运动下的接触力控制、运动补偿、重定位与扫描恢复；涵盖视觉、超声图像、学习、扰动观测/ESO、MPC等信息与执行机制。
  - 运动或非静止接触环境中在线估计刚度、阻抗或黏弹参数，并用于力控制；区分参数、接触点、相对形变、自由表面运动。
  - 由接触力或力加位置估计/预测生理或环境运动并补偿；区分同一受控探头和独立测量压头。
  - 六个用户指定锚点的2022–2026前向引文及其必要后向机制溯源。
  group_coverage: 明确检索TUM Nassir Navab / Zhongliang Jiang及合作者的相关序列；课题组声望不是独立admission门槛。
  inclusion_boundary: 与上述任务或信息—估计—控制链直接相关即可；额外视觉、US图像、学习、专用末端、力矩接口均不构成排除理由。泛化接触控制仅在移动/非静止环境的相关机制可由摘要确认时纳入。
  exclusion_boundary: 纯成像重建而无机器人运动/接触补偿、超声治疗、无接触机制关联的通用学习、人机意图等外域仅元数据线索；不得将标题相似当作纳入依据。
  historical_anchors: 用户指定的2022年前锚点只作已知来源及引用扩展背景，不计为2022–2026新发现；其他历史机制按正式规则定向补查，明确背景身份。

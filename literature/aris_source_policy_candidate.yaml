schema_version: 2
policy_version: c1-related-work-2026-10-26-v1
purpose: Targeted supplementation of the existing C1 related-work assessment; no research-question or method selection.
field_scope:
  task: Continuous constant-force robotic ultrasound scanning of moving and mechanically heterogeneous soft tissue.
  scientific_focus:
    - Online contact/environment identification connected to force-control decisions.
    - Adaptive or predictive impedance/admittance and coordinated reference compensation.
    - Tissue-motion and disturbance compensation, including methods using additional sensing as explicit comparators.
    - Joint geometry/compliance estimation and excitation/observability when relevant to contact control.
    - Stable variable-gain execution and contact recovery as supporting foundations.
  relevance_rule: Include a source only when its inspected content changes the account of an existing capability, closest method, information assumption, or execution condition for this task.
  exclude_from_core:
    - Pure ultrasound image reconstruction, segmentation, diagnosis, or registration without a material contact-control result.
    - Pure path planning or surface geometry without a relevant interaction-control contribution.
    - Generic MPC acceleration, optimization differentiation, or reinforcement learning without a direct contact-control relationship.
    - Robot-dynamics identification or rehabilitation intent inference presented as tissue-motion/stiffness identification.
    - Controller stiffness inferred from demonstration presented as environmental stiffness estimation.
    - Independent reverse-analysis samples presented as same-task prior work.
  categories: [direct_task_prior, direct_control_mechanism, supporting_foundation, method_transfer_only, excluded, unresolved]
fields:
  - name: Robotics and interaction control
    approved_elite_venues:
      - {canonical_name: IEEE Transactions on Robotics, aliases: [T-RO, TRO]}
      - {canonical_name: The International Journal of Robotics Research, aliases: [IJRR]}
      - {canonical_name: IEEE/ASME Transactions on Mechatronics, aliases: [TMECH]}
      - {canonical_name: IEEE Robotics and Automation Letters, aliases: [RA-L, LRA]}
      - {canonical_name: IEEE Transactions on Industrial Electronics, aliases: [TIE]}
      - {canonical_name: IEEE Transactions on Control Systems Technology, aliases: [TCST]}
      - {canonical_name: IEEE Transactions on Automation Science and Engineering, aliases: [TASE]}
      - {canonical_name: IEEE Transactions on Instrumentation and Measurement, aliases: [TIM]}
      - {canonical_name: IEEE Transactions on Biomedical Engineering, aliases: [TBME]}
      - {canonical_name: IEEE International Conference on Robotics and Automation, aliases: [ICRA]}
      - {canonical_name: IEEE/RSJ International Conference on Intelligent Robots and Systems, aliases: [IROS]}
      - {canonical_name: Robotics Science and Systems, aliases: [RSS]}
high_citation_rule:
  metric: raw_citation_count
  comparison: strictly_greater_than
  thresholds:
    - {publication_year_max: 1999, citation_count_strictly_greater_than: 300}
    - {publication_year_min: 2000, publication_year_max: 2009, citation_count_strictly_greater_than: 200}
    - {publication_year_min: 2010, publication_year_max: 2017, citation_count_strictly_greater_than: 100}
    - {publication_year_min: 2018, publication_year_max: 2020, citation_count_strictly_greater_than: 60}
    - {publication_year_min: 2021, publication_year_max: 2022, citation_count_strictly_greater_than: 35}
    - {publication_year_min: 2023, publication_year_max: 2023, citation_count_strictly_greater_than: 20}
    - {publication_year_min: 2024, publication_year_max: 2024, citation_count_strictly_greater_than: 10}
    - {publication_year_min: 2025, publication_year_max: 2025, citation_count_strictly_greater_than: 3}
    - {publication_year_min: 2026, publication_year_max: 9999, citation_count_strictly_greater_than: 1}
source_tracks:
  proactively_retrieved_literature:
    initial_decision: DISCOVERY_METADATA_ONLY
    active_read_gate: high_citation_or_approved_elite_venue
    exceptions: Identity-verified decisive closest/concurrent work, contradictory/negative results, or diagnostic/replication evidence may use the Controller-recorded narrow exception. This includes relevant RAS/CEP work without classifying every such publication as elite.
  user_supplied_material:
    decision: USER_SUPPLIED_READ
    roots:
      - D:/桌面/科研Agent Harness设计/impedance-control-e2e/source-materials
      - E:/github_project/scan-impedance-update/literature
search_routes:
  providers:
    - SerpApi Google Scholar.
    - Real serial Google Scholar browser interaction only if the primary provider is unavailable and that capability exists.
    - The deduplicated arXiv and IEEE Xplore fallback under the Controller rules.
  failure_behavior: Preserve provider failures and follow the Controller HUMAN_SEARCH_REQUIRED stop; ordinary hosted web search does not count as ARIS retrieval.
search_design:
  coverage: Complementary reviews and foundational anchors, recent representative methods, then closest-prior and backward/forward citation gaps.
  years: Foundational anchors without a lower-year cutoff; current-method queries stratified over 2021-2023 and 2024-2026, with publication eligibility checked as of 2026-10-26.
  languages: English and Chinese.
  source_types: Peer-reviewed originals, verified author manuscripts/preprints with version labels, and reviews for orientation.
  initial_targets:
    - Dynamic force tracking with unknown contact stiffness and equilibrium position.
    - Online contact identification with predictive variable impedance or admittance.
    - Robotic ultrasound motion compensation and disturbance-observer control.
    - Joint contact geometry/compliance estimation under force regulation.
    - Nearest-prior identities including DOSMAC, MHE-VIC, and the existing DOB-MPC ultrasound lead.
evidence_rules:
  - Title, DOI, venue and year verification do not establish scientific claims.
  - Abstracts/snippets remain at their observed scope; decisive method claims require inspected passages and page/section locators.
  - Do not infer that existing methods fail from the project's adaptations or from absence in search results.
  - A bounded search can establish a working related-work set, never exhaustive completeness.
  - Do not upload unpublished project prose, controller source, results or private notes to external model providers.
notes: Citation and venue rules are ARIS reading-eligibility rules, not scientific quality scores. No controllers, training, simulation expansion, or formal problem-discovery phases are authorized by this literature-only task.

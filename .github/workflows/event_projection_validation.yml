name: Event projection real simulator verification
on:
  push:
    branches: [research/event-projection-validation-20261104]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy numba
      - name: Compile and baseline/candidate smoke
        run: python experiments/event_projection_validation/validate_closed_loop.py --scenes 1 --label smoke
      - name: Paired diagnostic five families
        run: python experiments/event_projection_validation/validate_closed_loop.py --scenes 5 --label diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-projection-reports
          path: experiments/event_projection_validation/*.json

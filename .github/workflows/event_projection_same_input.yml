name: Event projection same-input estimator audit
on:
  push:
    branches: [research/event-projection-estimation-check-20261104]
jobs:
  same_input:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy numba
      - name: Verify same-input estimation across all five families
        run: python experiments/event_projection_validation/validate_same_input.py --scenes 3 --stride 4 --label same_input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-projection-same-input
          path: experiments/event_projection_validation/same_input.json
